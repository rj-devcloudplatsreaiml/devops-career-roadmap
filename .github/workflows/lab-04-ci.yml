name: Lab 04 Kubernetes CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "stage-01-junior-devops/lab-04-kubernetes-manifests/**"
      - ".github/workflows/lab-04-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "stage-01-junior-devops/lab-04-kubernetes-manifests/**"
      - ".github/workflows/lab-04-ci.yml"

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary stage-01-junior-devops/lab-04-kubernetes-manifests/k8s/
