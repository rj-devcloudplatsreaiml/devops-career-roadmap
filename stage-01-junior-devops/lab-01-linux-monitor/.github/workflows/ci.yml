name: Junior DevOps Lab 01 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n scripts/health_check.sh
          bash -n scripts/test_health_check.sh

      - name: Run smoke tests
        run: ./scripts/test_health_check.sh
